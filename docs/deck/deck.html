<!doctype html>
<!-- Pitch deck, style v1 (docs/mockups/deck-v1-*). Render: docs/deck/render.sh  (?s=0..8|a1..a5).
     Numbers: docs/REPORT.md, data/ours_ministral.json, data/Sense_Reply_B2_KPI_Conformity.xlsx, analysis/model_cost.py
     (see docs/PRESENTATION.md). Three scenarios: Pilot A, Pilot C, New framework. One family, tabular figures, no mono. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IS;src:url(../../demo/web/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:IS;src:url(../../demo/web/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IS;src:url(../../demo/web/node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-600-normal.woff2);font-weight:600}
:root{--bg:#FFFFFF;--ink:#151F27;--ink2:#3F4D5A;--mute:#66727E;--line:#D6E0EA;--faint:#EEF2F6;--card:#F4F8FC;
  --agent:#3A7DDA;--agent-soft:#E8F0FB;--agent-text:#2F6BC2;--alert:#EB0037;--alert-text:#C4002E;--good:#027A31}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font:400 22px/1.4 IS,sans-serif;position:relative;font-variant-numeric:tabular-nums lining-nums}
header{padding:88px 96px 0;height:250px}
h1{font:600 44px/1.16 IS;letter-spacing:-0.012em;max-width:1470px;text-wrap:balance}
.logo{position:absolute;top:66px;right:96px;width:210px;height:70px;overflow:hidden}
.logo img{display:block;width:210px;margin-top:-60px}
main{position:absolute;left:96px;right:96px;top:290px;bottom:112px}
footer{position:absolute;left:96px;right:96px;bottom:44px;display:flex;justify-content:space-between;font:400 16px IS;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
svg text{font-family:IS;font-variant-numeric:tabular-nums}
.lbl{font:500 20px IS;fill:var(--ink)}
.sub{font:400 17px IS;fill:var(--mute)}
.num{font:400 18px IS;fill:var(--mute)}
.k{font-size:18px;color:var(--mute)}
.blue{color:var(--agent-text)}
/* stats */
.stat .v{font:600 64px/1 IS;letter-spacing:-0.02em}
.stat .v small{font:400 26px IS;color:var(--mute);margin-left:8px;letter-spacing:0}
.stat .t{margin-top:12px;color:var(--ink2);font-size:21px}
/* tables */
table{border-collapse:collapse;width:100%}
th,td{padding:15px 20px;text-align:right;border-bottom:1px solid var(--faint);white-space:nowrap}
th{font:500 18px IS;color:var(--mute);border-bottom:1px solid var(--line);vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{font-size:22px}
td.ours,th.ours{background:var(--agent-soft)}
th.ours{color:var(--agent-text)}
td.dim,th.dim{color:var(--mute)}
/* lists */
ol.n{list-style:none;counter-reset:n}
ol.n li{counter-increment:n;position:relative;padding-left:52px;margin-bottom:26px}
ol.n li::before{content:counter(n);position:absolute;left:0;top:-2px;width:32px;height:32px;border:1.5px solid var(--ink);border-radius:50%;font:600 17px/30px IS;text-align:center}
ol.n li b{font-weight:600;display:block;margin-bottom:4px}
ol.n li span{color:var(--ink2);font-size:20px}
.cols{display:grid;gap:64px}
.colhead{font:600 22px IS;padding-bottom:14px;margin-bottom:26px;border-bottom:1px solid var(--ink)}
/* KPI grid (slides 2 and 7): the left edge says what the KPI is measured against */
.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:28px}
.kg h3{font:600 22px IS;padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.kg h3 span{font:500 15px IS;color:var(--mute);letter-spacing:.02em}
.kc{padding:9px 0 9px 14px;margin-bottom:8px;border-left:4px solid var(--line);background:var(--card);border-radius:0 6px 6px 0}
.kc b{display:block;font:600 19px/1.25 IS}
.kc i{display:block;font:400 16px/1.3 IS;font-style:normal;color:var(--mute);margin-top:3px}
.kc.rule{border-left-color:var(--agent)}
.key{display:flex;gap:30px;font-size:17px;color:var(--ink2);align-items:center}
.key s{display:inline-block;width:5px;height:20px;margin-right:9px;vertical-align:-4px;text-decoration:none}
/* platform diagram (slide 5) */
.pz{position:absolute;border:2px solid var(--agent);border-radius:10px}
.pz>.t{position:absolute;left:18px;top:12px;font:600 21px IS;color:var(--agent-text)}
.pi{position:absolute;border:1.5px solid var(--line);border-radius:8px}
.pi>.t{position:absolute;left:14px;top:8px;font:500 17px IS;color:var(--mute)}
.pb{position:absolute;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;text-align:center;font:400 17px/1.3 IS;color:var(--ink2)}
.pb b{font:600 20px/1.25 IS;color:var(--ink)}
.pb small{font-size:15px;color:var(--mute)}
.pb.new{background:var(--agent-soft);border:2.5px solid var(--agent)}
.pb.opt{border:2.5px dashed var(--agent)}
.pb.gone{border:2px dashed var(--alert);background:var(--faint);color:var(--mute)} .pb.gone b{text-decoration:line-through;color:var(--mute)}
.plbl{position:absolute;font:400 16px IS;color:var(--ink2);background:var(--bg);padding:0 4px}
</style></head>
<body>
<header><h1 id="t"></h1></header>
<div class="logo"><img src="../../assets/images/sense-reply-logo.avif" alt="Sense Reply"></div>
<main id="m"></main>
<footer><span id="src"></span><span id="pg"></span></footer>
<script>
const s=new URLSearchParams(location.search).get('s')||'0';
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg', M=$('m');
const css=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
function el(p,tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function arrow(defs,id,color){const m=el(defs,'marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto-start-reverse'});
  el(m,'path',{d:'M0,1 L9,5 L0,9',fill:'none',stroke:color,'stroke-width':1.6})}
const eur=v=>(v>0?'+':v<0?'−':'')+'€'+Math.abs(v).toFixed(2);
function frame(title,src,page){$('t').textContent=title;$('src').textContent=src;$('pg').textContent=page}

// 20 assessed KPIs: [code, plain question, unit + pass line, compared with the free rule?]
// Thresholds: workbook "KPI Verdicts" sheet. Results per scenario live in the demo's KPI tab.
const KPI=[['Value',[['S net','Saves at least as much as the rule?','€/wk · good if ≥ €1.03',1],
    ['VCR','Share of the best possible saving','ratio · good if ≥ 0.60'],
    ['VORB','Gain over the rule, before AI cost','€/wk · good if > 0',1]]],
  ['AI economics',[['N1','Profitable after AI cost?','€/wk · good if > 0'],
    ['F1','Gain over the rule, after AI cost','€/wk · good if > 0',1],
    ['N2','AI cost per € saved','ratio · good if < 0.2'],
    ['O5','AI cost per site','€/wk · good if < 0.50'],
    ['O1','LLM calls per 15-min decision','good if < 0.3'],
    ['O3','LLM time in the 15-min slot','good if < 10%']]],
  ['Carbon',[['S2b','CO2 avoided vs the rule','kg/wk · good if > 0',1],
    ['S3','Imports at clean hours?','g/kWh · good if < 356'],
    ['MAC','Cost per kg of CO2 avoided','€/kg · good if < 0.09']]],
  ['Self-use and grid',[['SCR','Solar used on site','good if ≥ 70%'],
    ['SSR','Self-sufficiency','good if ≥ 60%'],
    ['PSR','Peak cut vs no battery','good if ≥ 25%'],
    ['G2','Grid violations','good if 0']]],
  ['Battery and timing',[['B1','Storage efficiency','good if ≥ 88%'],
    ['B2','Full cycles per week','good if ≤ 7'],
    ['B4','Time at charge limits','good if ≤ 25%'],
    ['C5','Imports at expensive hours','good if ≤ 50%']]]];

const S={
'0'(){ // title
  document.querySelector('header').remove();document.querySelector('footer').remove();
  M.style.top='0';M.style.bottom='0';
  M.innerHTML=`<div style="position:absolute;left:0;top:330px;max-width:1400px">
    <div style="font:600 112px/1.02 IS;letter-spacing:-0.025em">One carbon-aware agent, on a model Reply owns</div>
    <div style="margin-top:40px;font-size:30px;color:var(--ink2)">How to make Sense Reply's battery agents pay for themselves</div></div>
    <div style="position:absolute;left:0;right:0;bottom:96px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:24px;font-size:22px">
    <span>Sydney · Amir · Francesco</span><span style="color:var(--mute)">Albert School Business Deep Dive, case B2 · November 2026</span></div>`;
},
'1'(){
  frame('One self-hosted agent that plans once a day turns pilot C\'s €7.31 weekly loss into a €0.98 gain and cuts the AI bill by 98%',
    'Source: report §1, §6 · pilot C measured; new framework modelled on the same sun, load and prices · Ministral 3 8B at 1,000 sites · one winter week, Italy assumed','1 / 8');
  const C=[['Net value after AI cost','€ per site per week','−7.31','+0.98'],['AI bill','€ per site per week','7.71','0.18'],['Grid CO2','kg per week','21.3','12.2']];
  M.innerHTML=`<div class="cols" style="grid-template-columns:repeat(3,1fr);margin-top:150px">${C.map(c=>`
    <div style="border-top:1px solid var(--ink);padding-top:26px">
      <div style="font:500 24px IS">${c[0]}</div><div class="k">${c[1]}</div>
      <div style="display:flex;align-items:baseline;gap:28px;margin-top:56px">
        <div><div class="k">Pilot C today</div><div style="font:400 56px/1.1 IS;color:var(--mute);letter-spacing:-0.02em;margin-top:8px">${c[2]}</div></div>
        <svg width="56" height="20" style="flex:none"><path d="M0 10H52M44 3l8 7-8 7" fill="none" stroke="${css('--ink')}" stroke-width="2"/></svg>
        <div><div class="k blue">New framework</div><div style="font:600 104px/1 IS;color:var(--agent-text);letter-spacing:-0.03em;margin-top:8px">${c[3]}</div></div>
      </div></div>`).join('')}</div>`;
},
'2'(){
  frame('We judge every agent against a free rule, because "saved vs no battery" alone makes the pilots look profitable',
    'Source: report §4, §5 · data/Sense_Reply_B2_KPI_Conformity.xlsx (thresholds editable) · the rule is simulated on each run\'s own sun, load and prices','2 / 8');
  M.style.top='262px';
  M.innerHTML=`<div style="position:absolute;left:0;top:0;width:400px;bottom:0;background:var(--agent-soft);border-radius:12px;padding:30px 30px">
     <div style="font:600 26px IS;color:var(--agent-text)">The free rule</div>
     <div style="color:var(--ink2);font-size:19px;margin-top:6px">Two lines of code. No AI, no forecast, costs nothing.</div>
     <div style="margin-top:28px;font:500 21px/1.5 IS">If the sun makes more than the house uses, <span class="blue">charge</span>.</div>
     <div style="margin-top:14px;font:500 21px/1.5 IS">If the house uses more than the sun makes, <span class="blue">discharge</span>.</div>
     <div style="margin-top:28px;padding-top:22px;border-top:1px solid var(--line);font-size:19px;color:var(--ink2)">On the pilot week it saves</div>
     <div class="stat"><div class="v" style="font-size:56px">€1.03<small>per week</small></div></div>
     <div style="margin-top:22px;font-size:19px;color:var(--ink2)">Any AI must beat this. If it cannot, ship the rule.</div></div>
   <div class="kg" style="position:absolute;left:440px;right:0;top:0;gap:20px">${KPI.map(g=>`<div><h3 style="font-size:20px">${g[0]}</h3>
     ${g[1].map(k=>`<div class="kc${k[3]?' rule':''}"><b style="font-size:18px">${k[1]}</b><i style="font-size:15px">${k[0]} · ${k[2]}</i></div>`).join('')}</div>`).join('')}</div>
   <div class="key" style="position:absolute;left:440px;bottom:0"><span><s style="background:var(--agent)"></s>blue edge: compared with the free rule</span></div>`;
},
'3'(){
  frame('Both pilots lose to a free rule with an AI bill 8 to 12 times their saving; one daily agent\'s bill is an eighth of what it saves',
    'Source: report §1, §4 step 9 · AI cost at the assumed Devstral 2 list price ($0.40 / $2.00 per M tokens, 0.86 €/$)','3 / 8');
  const W=1080,H=520,x0=250,sc=(W-x0-150)/8, g=el(M,'svg',{width:W,height:H,style:'position:absolute;left:0;top:10px'});
  const ink=css('--ink'),ag=css('--agent');
  const R=[{n:'Pilot A',d:'cost agent',sv:0.60,ai:4.74,r:'7.8×'},{n:'Pilot C',d:'cost + sustainability',sv:0.63,ai:7.71,r:'12.2×'},{n:'New framework',d:'one daily agent',sv:1.42,ai:0.18,r:'0.12×',ours:1}];
  for(let t=0;t<=8;t+=2){el(g,'line',{x1:x0+t*sc,x2:x0+t*sc,y1:0,y2:H-60,stroke:css('--faint')});el(g,'text',{x:x0+t*sc,y:H-28,'text-anchor':'middle',class:'num'},'€'+t)}
  el(g,'text',{x:W-150,y:H-2,'text-anchor':'end',class:'sub'},'€ per week');
  R.forEach((r,i)=>{const y=20+i*158;
    el(g,'text',{x:0,y:y+30,class:'lbl',style:`font-weight:600;font-size:24px${r.ours?';fill:'+css('--agent-text'):''}`},r.n);el(g,'text',{x:0,y:y+58,class:'sub'},r.d);
    el(g,'rect',{x:x0,y,width:r.sv*sc,height:44,rx:4,fill:ag});
    el(g,'text',{x:x0+r.sv*sc+12,y:y+30,class:'lbl'},'Saving vs no battery  €'+r.sv.toFixed(2));
    el(g,'rect',{x:x0,y:y+56,width:r.ai*sc,height:44,rx:4,fill:ink});
    el(g,'text',{x:x0+r.ai*sc+12,y:y+86,class:'lbl'},'AI bill  €'+r.ai.toFixed(2));
    el(g,'text',{x:x0+r.ai*sc+12,y:y+112,class:'sub',style:`fill:${css(r.ours?'--good':'--alert-text')}`},r.r+' the saving');
  });
  M.insertAdjacentHTML('beforeend',`<div class="k" style="position:absolute;left:0;bottom:0;font-size:20px;color:var(--ink2)">Net after AI cost: pilot A <b style="font-weight:600">−€4.33</b>, pilot C <b style="font-weight:600">−€7.31</b>, new framework <b style="font-weight:600;color:var(--agent-text)">+€0.98</b>, free rule <b style="font-weight:600">+€1.03</b> with no AI at all</div>
   <div style="position:absolute;right:0;top:0;width:560px"><div class="colhead">Why they lose, read from the prompts</div>
   <ol class="n"><li><b>A fixed 80% target</b><span>fills the battery by late morning, so midday sun goes to the grid</span></li>
   <li><b>Export valued at zero</b><span>sold at €0.09, bought back at €0.11–0.12 in the evening</span></li>
   <li><b>A blind second agent</b><span>gets no price and no CO2, so it can only push "import less"</span></li></ol></div>`);
},
'4'(){
  frame('A second agent buys CO2 at €4,300 a tonne, 48 times the EU carbon price, while a carbon weight inside one agent costs about nothing',
    'Source: report §6, §7.2 · new framework modelled on run C inputs, one winter week · CO2 at 0.356 kg/kWh · Italy assumed','4 / 8');
  const W=1160,H=660, m={l:96,r:24,t:20,b:76}, X=[10,24], Y=[-8,2.5];
  const x=d=>m.l+(d-X[0])/(X[1]-X[0])*(W-m.l-m.r), y=d=>m.t+(Y[1]-d)/(Y[1]-Y[0])*(H-m.t-m.b);
  const g=el(M,'svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`});
  for(let t=-8;t<=2;t+=2){el(g,'line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:css(t===0?'--ink':'--faint'),'stroke-width':t===0?1.5:1});
    el(g,'text',{x:m.l-16,y:y(t)+6,'text-anchor':'end',class:'num'},(t>0?'+':t<0?'−':'')+Math.abs(t))}
  for(let t=10;t<=24;t+=2) el(g,'text',{x:x(t),y:H-m.b+34,'text-anchor':'middle',class:'num'},t);
  el(g,'text',{x:W-m.r,y:H-8,'text-anchor':'end',class:'sub'},'Grid CO2, kg per week  (lower is cleaner)');
  el(g,'text',{x:m.l-16,y:m.t-2,'text-anchor':'end',class:'sub'},'€/wk');
  el(g,'text',{x:W-m.r,y:y(0)+30,'text-anchor':'end',class:'sub'},'Break-even after AI cost');
  el(g,'text',{x:m.l+12,y:y(-7.6),class:'sub'},'Net value after AI cost (N1)');
  const defs=el(g,'defs',{});arrow(defs,'ah',css('--alert'));
  el(g,'line',{x1:x(21.9)-6,y1:y(-4.33)+14,x2:x(21.3)+4,y2:y(-7.31)-16,stroke:css('--alert'),'stroke-width':2,'stroke-dasharray':'6 5','marker-end':'url(#ah)'});
  el(g,'text',{x:x(21.6)+22,y:y(-5.9),class:'lbl',style:`fill:${css('--alert-text')}`},'+ second agent');
  el(g,'text',{x:x(21.6)+22,y:y(-5.9)+26,class:'sub'},'+€2.97 AI cost, −0.7 kg');
  const P=[{n:'Pilot A',d:'cost agent',c:21.9,e:-4.33,k:'pilot',lx:-18,ly:6,a:'end'},
    {n:'Pilot C',d:'cost + sustainability agents',c:21.3,e:-7.31,k:'pilot',lx:-18,ly:6,a:'end'},
    {n:'Free rule',d:'yardstick, no AI',c:11.9,e:1.03,k:'rule',lx:-4,ly:-46,a:'start'},
    {n:'New framework',d:'one agent, λ €0.10/kg',c:12.2,e:0.98,k:'ours',lx:24,ly:6,a:'start'}];
  for(const p of P){const cx=x(p.c),cy=y(p.e),ag=css('--agent'),bg=css('--bg');
    const st={pilot:{fill:css('--ink'),stroke:bg},rule:{fill:bg,stroke:css('--ink2')},ours:{fill:ag,stroke:bg}}[p.k];
    el(g,'circle',{cx,cy,r:p.k==='ours'?11:10,fill:st.fill,stroke:st.stroke,'stroke-width':p.k==='rule'?3:2.5});
    el(g,'text',{x:cx+p.lx,y:cy+p.ly,'text-anchor':p.a,class:'lbl',style:p.k==='ours'?`fill:${css('--agent-text')}`:''},p.n);
    el(g,'text',{x:cx+p.lx,y:cy+p.ly+24,'text-anchor':p.a,class:'sub'},p.d+' · '+eur(p.e))}
  M.insertAdjacentHTML('beforeend',`<div style="position:absolute;right:0;top:0;width:500px">
    ${[['4,300','What the second agent pays per tonne of CO2 avoided (€2,000 on hourly carbon)',''],['90','EU ETS carbon price, Dec-2026 contract',''],['≈ 0','Carbon weight of €0.10/kg inside one agent: 0.85 kg less, no extra cost this week','blue']]
      .map((r,i)=>`<div class="stat" style="padding:${i?26:4}px 0 26px;border-bottom:1px solid var(--line)"><div class="v ${r[2]}">${r[0]}<small>€/t</small></div><div class="t">${r[1]}</div></div>`).join('')}</div>`);
},
'5'(){
  frame('We change two things on Reply\'s platform: a self-hosted Ministral 3 8B replaces the retired LLM, and the LLM leaves the 15-minute loop',
    'Source: report §3.1 · adapted from Sense Reply, "Agentic Operations for E&U" (BDD brief) · site assumed Italy','5 / 8');
  const B=(x,y,w,h,c,html)=>`<div class="pb ${c}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${html}</div>`;
  M.innerHTML=`
   <div class="pz" style="left:0;top:0;width:620px;height:630px"><div class="t">Field devices, one home site</div></div>
   ${B(24,70,200,76,'','<b>PV, 9 panels</b>')}${B(24,176,200,76,'','<b>Battery 10 kWh</b><small>10–90%, 5 kW</small>')}${B(24,282,200,76,'','<b>House + grid meter</b>')}
   ${B(276,52,320,122,'new','<b>Edge agent</b>rule + clamp every 15 min<small>fallback: yesterday\'s plan, then the rule</small>')}
   ${B(306,214,260,76,'','<b>IoT edge gateway</b>')}
   ${B(276,340,320,116,'opt','<b>Ministral 3 3B on the gateway</b>paid option: replans offline, data stays on site')}
   <div style="position:absolute;left:24px;top:500px;width:572px;font-size:19px;color:var(--ink2)">Internet down? The site keeps running on the rule, the clamp and yesterday's plan.</div>
   <div class="pz" style="left:720px;top:0;width:760px;height:630px"><div class="t">Reply platform, on-premise</div></div>
   <div class="pi" style="left:740px;top:50px;width:720px;height:110px"><div class="t">Business applications</div></div>
   ${B(990,66,440,78,'','<b>Owner app</b>plan + reason, λ dial € ↔ CO2')}
   <div class="pi" style="left:740px;top:180px;width:720px;height:432px"><div class="t">Industrial IoT platform</div></div>
   ${B(760,220,330,166,'new','<b>Validator + replay gate</b>schema and limits, then replays the plan on recent days')}
   ${B(1110,220,330,166,'new','<b>Ministral 3 8B, self-hosted</b>one agent, goal € + λ·CO2<small>1 call per site per day</small>')}
   ${B(760,430,330,166,'','<b>Edge Apps Store</b>ships the edge agent and, for the paid option, signed 3B weights')}
   ${B(1110,430,330,166,'','<b>Data Lake</b>telemetry, memory of past days, replay logs')}
   ${B(1540,66,188,78,'','<b>Site owners</b>')}${B(1540,240,188,78,'','<b>IoT operator</b>')}
   ${B(1540,380,188,120,'new','<b>External feeds</b>day-ahead prices, ENTSO-E CO2')}
   ${B(1540,530,188,100,'gone','<b>External LLM</b>Devstral 2, retired Jul 2026')}
