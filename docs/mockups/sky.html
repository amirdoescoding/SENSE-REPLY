<!doctype html><html><head><meta charset="utf-8"><title>sky mock</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
:root{--ink:#151F27;--ink-2:#3F4D5A;--mute:#8D99A5;--line:#D6E0EA;--paper:#F4F8FC;--sun:#F2A900;--store:#02B843;--grid:#586674}
*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;background:var(--paper);font:14px 'Instrument Sans',sans-serif;color:var(--ink);overflow:hidden}
#card{position:absolute;left:32px;top:214px;width:1400px;height:556px;border-radius:12px;border:1px solid var(--line);box-shadow:0 1px 2px #151F270F;overflow:hidden}
#sky{position:absolute;inset:0}#cv{position:absolute;inset:0}
.disc{position:absolute;border-radius:50%;width:44px;height:44px;margin:-22px 0 0 -22px}
.star{position:absolute;width:2px;height:2px;background:#E8EDF2;border-radius:50%}
.lab{position:absolute;transform:translate(-50%,-100%);text-align:center}
.lab .n{font-size:13px;color:var(--ink);margin-bottom:4px}
.lab .c{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:500 15px 'JetBrains Mono',monospace;box-shadow:0 1px 2px #151F270F}
.lab .c i{width:8px;height:8px;border-radius:50%}
.lab .l{width:0;height:22px;border-left:1px dotted var(--mute);margin:0 auto}
#hd{position:absolute;left:20px;top:18px;font-size:13px;color:var(--mute)}
#lg{position:absolute;left:20px;bottom:14px;font-size:13px;color:var(--ink-2);display:flex;gap:16px}
#lg b{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
#tm{position:absolute;right:20px;top:16px;font:500 15px 'JetBrains Mono',monospace;color:var(--ink)}
body.night .n,body.dusk #tm,body.dusk #hd,body.dusk #lg,body.night #tm,body.night #hd,body.night #lg{color:#E8EDF2}
#mk{position:absolute;right:24px;bottom:12px;font:11px 'JetBrains Mono';color:var(--mute)}
</style></head><body>
<div id="card"><div id="sky"></div><canvas id="cv"></canvas><div id="hd">Site, replaying 15-minute steps</div><div id="tm"></div>
<div id="lg"><span><b style="background:var(--sun)"></b>Solar</span><span><b style="background:var(--store)"></b>Battery</span><span><b style="background:var(--grid)"></b>Grid</span></div><div id="mk">MOCKUP · mock data</div></div>
<script type="module">
import * as T from 'three';
const q=new URLSearchParams(location.search),dome=q.get('v')==='dome',ts=q.get('t')||'10:00';
const hh=+ts.split(':')[0]+ +ts.split(':')[1]/60, W=1400-2,H=556-2;
// mock telemetry per time (PV, house, battery kW sign: + discharge, SoC, grid import)
const D={'10:00':{pv:3.42,h:1.18,b:-2.24,soc:54,g:0},'18:30':{pv:0.09,h:1.32,b:1.23,soc:62,g:0},'23:00':{pv:0,h:0.96,b:0,soc:15,g:0.96}}[ts];
// sun: first/last PV>0 step = 04:30/18:45 (14 h window, peak ~10:00); altitude follows the PV arc
const RISE=4.5,SET=18.75,p=(hh-RISE)/(SET-RISE),inDay=p>=0&&p<=1;
const alt=inDay?65*Math.sin(Math.PI*p):-20;
const mq=((hh-19.5+24)%24)/9.5,moon=mq>=0&&mq<=1,malt=moon?55*Math.sin(Math.PI*mq):-10;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const C=s=>new T.Color(s),mix=(a,b,k)=>C(a).lerp(C(b),k);
const kn=sm(-10,0,alt),kd=sm(0,30,alt),night=1-kn;
const top=mix(mix('#1A2432','#5B6E92',kn).getStyle(),'#C9DDF2',kd), hor=mix(mix('#2A3A4E','#EFAE7C',kn).getStyle(),'#F4F8FC',kd);
const dim=1-.3*night;
// sky (backdrop = CSS)
if(night>.5)document.body.classList.add('night');if(alt<8)document.body.classList.add('dusk');
const card=document.getElementById('card'),sky=document.getElementById('sky');
document.getElementById('tm').textContent='Wed 7 Jan '+ts;
const lx=a=>(.06+.88*a)*W;
if(!dome){
  sky.style.background=`linear-gradient(${'#'+top.getHexString()} 0%,${'#'+hor.getHexString()} 75%)`;
  const disc=(x,y,c,o)=>{const d=document.createElement('div');d.className='disc';d.style.cssText+=`left:${x}px;top:${y}px;background:${c};opacity:${o}`;sky.appendChild(d)};
  if(alt>-6)disc(lx(p),330-Math.max(alt,0)/65*270,'#F2A900',1);
  if(moon&&night>.5)disc(lx(mq),330-malt/55*260,'#F1F3F0',1);
  let s=7;for(let i=0;i<90;i++){s=(s*16807)%2147483647;const a=s/2147483647;s=(s*16807)%2147483647;const b=s/2147483647;
    const e=document.createElement('div');e.className='star';e.style.cssText=`left:${a*W}px;top:${b*300}px;opacity:${night*(.4+.6*((i*7)%5)/4)}`;sky.appendChild(e)}
}
const R=new T.WebGLRenderer({canvas:document.getElementById('cv'),antialias:true,alpha:!dome});
R.setSize(W,H,false);document.getElementById('cv').style.width=W+'px';document.getElementById('cv').style.height=H+'px';R.setPixelRatio(1);
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();
const M=(c,e)=>new T.MeshLambertMaterial({color:c,flatShading:true,emissive:e||0});
const WH=M('#FFFFFF'),GR=M('#E8EDF2'),DK=M('#26364A'),IK=M('#3F4D5A');
const add=(g,m,x,y,z,par)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;(par||S).add(o);return o};
const bx=(w,h,d,m,x,y,z,par)=>add(new T.BoxGeometry(w,h,d),m,x,y,z,par);
const beam=(a,b,t,m)=>{const A=new T.Vector3(...a),B=new T.Vector3(...b),o=new T.Mesh(new T.BoxGeometry(t,t,A.distanceTo(B)),m);o.position.copy(A).add(B).multiplyScalar(.5);o.lookAt(B);o.castShadow=true;S.add(o)};
// floor
const slab=bx(15,.3,13,M('#F4F8FC'),0,-.15,0);slab.material.color.multiplyScalar(dim);
const gl=[];for(let i=-7;i<=7;i++)gl.push(i,.01,-6.5,i,.01,6.5);for(let j=-6;j<=6;j++)gl.push(-7.5,.01,j+.5,7.5,.01,j+.5);
const gg=new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(gl,3));
S.add(new T.LineSegments(gg,new T.LineBasicMaterial({color:mix('#D6E0EA','#7D8996',night*.7)})));
// house at (0,-2)
const gx=0,gz=-2.2,glow=D.h>0&&alt<12;
bx(4.4,2.2,3.2,WH,gx,1.1,gz);
const sh=new T.Shape();sh.moveTo(-2.05,0);sh.lineTo(2.05,0);sh.lineTo(0,1.5);sh.closePath();
const rg=new T.ExtrudeGeometry(sh,{depth:4.9,bevelEnabled:true,bevelSize:.07,bevelThickness:.07,bevelSegments:1});rg.translate(0,0,-2.45);rg.rotateY(Math.PI/2);
add(rg,GR,gx,2.2,gz);
bx(.5,1.3,.5,GR,gx+1.2,3.0,gz-.4);bx(.64,.1,.64,WH,gx+1.2,3.7,gz-.4);
bx(.9,1.5,.08,IK,gx-1.2,.75,gz+1.64);bx(.08,.08,.04,GR,gx-.95,.8,gz+1.7);
const gm=M(glow?'#F6C56B':'#B9CCDD',glow?'#F6C56B':0);
for(const[x,y]of[[1.0,1.2]]){bx(1.1,.9,.1,GR,gx+x,y,gz+1.62);bx(.9,.7,.1,gm,gx+x,y,gz+1.64)}
for(const z of[-.6,.7]){bx(.1,.9,1.0,GR,gx+2.2,1.2,gz+z);bx(.1,.7,.8,gm,gx+2.22,1.2,gz+z)}
// PV 3x3 at (-4.4, 4.3)
const px=-4.4,pz=4.0,tilt=.5;
for(let r=0;r<3;r++)for(let c=0;c<3;c++){
  const g=new T.Group();g.position.set(px+(c-1)*1.55,.95+.0,pz+(r-1)*1.25);g.rotation.x=tilt;S.add(g);
  bx(1.45,.07,1.1,GR,0,0,0,g);bx(1.33,.05,.98,DK,0,.04,0,g);
  const v=[];for(let i=1;i<6;i++)v.push(-.665+i*1.33/6,.07,-.49,-.665+i*1.33/6,.07,.49);for(let j=1;j<4;j++)v.push(-.665,.07,-.49+j*.98/4,.665,.07,-.49+j*.98/4);
  g.add(new T.LineSegments(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(v,3)),new T.LineBasicMaterial({color:'#5A7192'})));
}
for(let r=0;r<3;r++)for(const x of[-2.3,2.3]){const z=pz+(r-1)*1.25;bx(.08,.9,.08,GR,px+x,.45,z-.3);bx(.08,.5,.08,GR,px+x,.25,z+.4)}
bx(4.9,.06,.06,IK,px,.75,pz-1.3);
// battery cabinet at (3.6, 3.6)
const bxp=5.2,bzp=2.4;
bx(1.7,2.1,1.2,WH,bxp,1.05,bzp);bx(1.8,.12,1.3,GR,bxp,2.16,bzp);
for(let i=0;i<5;i++)bx(.04,.07,.9,IK,bxp+.86,.5+i*.16,bzp);
bx(.5,.5,.04,IK,bxp+.3,1.0,bzp+.61);// track
bx(.22,1.5,.04,IK,bxp-.45,1.1,bzp+.61);
const fh=1.4*D.soc/100;bx(.14,fh,.05,M('#02B843'),bxp-.45,.4+fh/2,bzp+.62);
bx(.14,.14,.05,M(Math.abs(D.b)>0?'#02B843':'#8D99A5',Math.abs(D.b)>0?'#02B843':0),bxp+.45,1.7,bzp+.62);
// pylon at (6.3,-3.8)
const ox=6.3,oz=-3.6,Pm=M('#586674');
const L=(h)=>.25+.6*(1-h/6);
for(const[sx,sz]of[[-1,-1],[1,-1],[1,1],[-1,1]]){beam([ox+sx*.7,0,oz+sz*.7],[ox+sx*.12,6,oz+sz*.12],.07,Pm)}
for(let h=0;h<6;h+=1){const a=.7-h*.097,b=.7-(h+1)*.097;const P=[[-1,-1],[1,-1],[1,1],[-1,1]];
 for(let i=0;i<4;i++){const[s1,t1]=P[i],[s2,t2]=P[(i+1)%4];beam([ox+s1*a,h,oz+t1*a],[ox+s2*b,h+1,oz+t2*b],.04,Pm);}}
for(const y of[4.7,5.5]){beam([ox-1.7,y,oz+1.7],[ox+1.7,y,oz-1.7],.07,Pm)}
// wires off-scene: catenary from arm tips
const wire=(a,b)=>{const pts=[];for(let i=0;i<=40;i++){const u=i/40;const v=new T.Vector3(...a).lerp(new T.Vector3(...b),u);v.y-=Math.sin(Math.PI*u)*.9+u*0.8;pts.push(v)}
 S.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:'#586674'})))};
for(const y of[4.7,5.5])for(const s of[-1.7,1.7])wire([ox+s,y,oz-s],[ox+s,y-.3,oz-s-40])
// flow paths on the floor (x,z)
const paths={
 pv:{c:'#F2A900',p:[[px+.5,pz-1.7],[px+.5,.2],[-.8,.2],[-.8,gz+1.7]]},
 bat:{c:'#02B843',p:[[bxp-.9,bzp-.3],[.9,bzp-.3],[.9,gz+1.7]]},
 pvbat:{c:'#F2A900',p:[[px+2.5,pz+.4],[bxp-.3,pz+.4],[bxp-.3,bzp+.7]]},
 grid:{c:'#586674',p:[[ox,oz+.6],[ox,gz],[gx+2.4,gz]]}};
const act={pv:D.pv>0.05&&D.h>0,pvbat:D.b<0,bat:D.b>0,grid:D.g>0};
const pw={pv:D.pv,pvbat:-D.b,bat:D.b,grid:D.g};
const dot=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();x.arc(16,16,15,0,7);x.fill();return new T.CanvasTexture(c)})();
for(const k in paths){const P=paths[k].p.map(([x,z])=>new T.Vector3(x,.02,z));
 const on=act[k];
 for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],len=a.distanceTo(b);
  const m=new T.Mesh(new T.PlaneGeometry(.28,len+.28),new T.MeshBasicMaterial({color:mix('#DCE5EE','#6D7A88',night*.6)}));
  m.rotation.x=-Math.PI/2;m.position.copy(a).add(b).multiplyScalar(.5);if(Math.abs(b.x-a.x)>Math.abs(b.z-a.z))m.rotation.z=Math.PI/2;m.position.y=.015;S.add(m);
  const m2=new T.Mesh(new T.PlaneGeometry(.07,len+.07),new T.MeshBasicMaterial({color:on?paths[k].c:mix('#C4D0DC','#7D8996',night*.6),transparent:true,opacity:on?.55:1}));
  m2.rotation.copy(m.rotation);m2.position.copy(m.position);m2.position.y=.02;S.add(m2)}
 if(!on)continue;
 const segs=P.slice(1).map((b,i)=>[P[i],b,P[i].distanceTo(b)]),tot=segs.reduce((s,x)=>s+x[2],0),n=Math.max(5,Math.round(tot*(.7+pw[k]*.25)));
 const pos=[];for(let i=0;i<n;i++){let d=((i+.37)/n)*tot;for(const[a,b,l]of segs){if(d<=l){pos.push(...a.clone().lerp(b,d/l).toArray());break}d-=l}}
 const pg=new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(pos.map((v,i)=>i%3==1?.12:v),3));
 S.add(new T.Points(pg,new T.PointsMaterial({color:paths[k].c,size:9,sizeAttenuation:false,map:dot,alphaTest:.5,transparent:true,depthTest:false})))}
// lights
const amb=new T.AmbientLight(mix(mix('#A9BBD2','#E4E9F0',kn).getStyle(),'#FFFFFF',kd),mix(.85,1.0,kn)*(1-kd*.35)*0+ (night>.5?.9:.62)),dl=new T.DirectionalLight();
amb.intensity=night>.5?2.7:1.8+.7*kn*(1-kd);S.add(amb);
const se=Math.max(alt,14)*Math.PI/180,th=(-70+140*Math.min(1,Math.max(0,p))+22)*Math.PI/180;
let ld;if(night>.5){ld=new T.Vector3(-.5,1,.8).normalize();dl.color=C('#9FB4D6');dl.intensity=1.0}
else{ld=new T.Vector3(Math.sin(th)*Math.cos(se),Math.sin(se),Math.cos(th)*Math.cos(se));dl.color=mix('#FFC48A','#FFFFFF',kd);dl.intensity=1.9+.4*kn}
dl.position.copy(ld).multiplyScalar(30);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:70});dl.shadow.radius=3;dl.shadow.bias=-.0005;S.add(dl);
// camera
let cam;const e=35.264*Math.PI/180;
if(!dome){const ppu=42;cam=new T.OrthographicCamera(-W/2/ppu,W/2/ppu,H/2/ppu,-H/2/ppu,.1,200);
  cam.position.set(Math.cos(e)*Math.sin(Math.PI/4),Math.sin(e),Math.cos(e)*Math.cos(Math.PI/4)).multiplyScalar(40);cam.lookAt(0,.9,0);cam.setViewOffset(W,H,0,-34,W,H)}
else{cam=new T.PerspectiveCamera(46,W/H,1,900);const el=21*Math.PI/180;
  cam.position.set(Math.cos(el)*Math.sin(Math.PI/4),Math.sin(el),Math.cos(el)*Math.cos(Math.PI/4)).multiplyScalar(18).add(new T.Vector3(0,.9,0));cam.lookAt(0,.9,0);cam.setViewOffset(W,H,0,-75,W,H);
  const g=new T.Mesh(new T.CircleGeometry(600,48),new T.MeshBasicMaterial({fog:false,color:mix(mix('#1B2633','#A9A3A5',kn).getStyle(),'#E1E8F0',kd)}));g.rotation.x=-Math.PI/2;g.position.y=-.32;S.add(g);
  const sk=new T.Mesh(new T.SphereGeometry(700,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:top},h:{value:hor}},
   vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
   fragmentShader:'uniform vec3 t,h;varying vec3 v;void main(){gl_FragColor=vec4(mix(h,t,pow(clamp(v.y*3.2,0.,1.),.7)),1.);\n#include <colorspace_fragment>\n}'}));sk.renderOrder=-2;S.add(sk);
  // sun/moon on the dome. Elevation compressed: the lower camera only sees ~12 deg above the horizon.
  const onDome=(a,el,r,c)=>{const m=new T.Mesh(new T.SphereGeometry(r,24,12),new T.MeshBasicMaterial({color:c,fog:false,depthWrite:false}));
   const az=(-.5+a)*1.5+Math.PI*1.25, E=el*Math.PI/180;m.position.set(Math.sin(az)*Math.cos(E),Math.sin(E),Math.cos(az)*Math.cos(E)).multiplyScalar(500);m.lookAt(0,0,0);m.renderOrder=-1;S.add(m)};
  if(alt>-6)onDome(p,Math.max(alt,-2)/65*7+.5,11,'#F2A900');
  if(moon&&night>.5)onDome(mq,malt/55*6+1.5,9,'#F1F3F0');
  const sp=[];let s=11;for(let i=0;i<260;i++){s=(s*16807)%2147483647;const a=s/2147483647;s=(s*16807)%2147483647;const b=s/2147483647;const A=a*Math.PI*2,E=(.02+b*.12)*Math.PI/2;
   const dir=new T.Vector3(Math.sin(A)*Math.cos(E),Math.sin(E),Math.cos(A)*Math.cos(E));sp.push(...dir.multiplyScalar(600).toArray())}
  S.add(new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(sp,3)),new T.PointsMaterial({color:'#E8EDF2',size:2.5,sizeAttenuation:false,transparent:true,opacity:night,fog:false,depthWrite:false})))}
R.render(S,cam);
// labels
const lab=(n,v,col,x,y,z,dy=0,dx=0)=>{const P=new T.Vector3(x,y,z).project(cam),d=document.createElement('div');d.className='lab';
 d.innerHTML=`<div class="n">${n}</div><div class="c"><i style="background:${col}"></i>${v}</div><div class="l"></div>`;
 d.style.left=(P.x*.5+.5)*W+dx+'px';d.style.top=(-P.y*.5+.5)*H+dy+'px';card.appendChild(d)};
const f=x=>x.toFixed(2);
lab('PV',f(D.pv)+' kW','#F2A900',px,2.3,pz,-2);lab('House',f(D.h)+' kW','#3F4D5A',0,4.3,gz+.5);
lab('Battery','SoC '+D.soc+' %','#02B843',bxp,2.4,bzp,0,dome?0:90);lab('Grid',f(D.g)+' kW','#586674',ox,6.3,oz);
</script></body></html>
