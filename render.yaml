services:
  - type: web
    name: sense-reply-demo
    runtime: python
    plan: free
    # The web build needs Node (vite 8) in Render's Python build image: NODE_VERSION pins it.
    buildCommand: pip install -r demo/requirements.txt && cd demo/web && npm ci && npm run build
    startCommand: uvicorn --app-dir demo api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz  # open even with DEMO_PASSCODE set
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: NODE_VERSION
        value: "22"
      - key: ENTSO_API
        sync: false
      - key: DEMO_PASSCODE  # Basic auth on the whole site (any user name)
        sync: false
