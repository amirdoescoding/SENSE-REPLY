services:
  - type: web
    name: sense-reply-demo
    runtime: python
    plan: free
    # session 4 appends `cd demo/web && npm ci && npm run build` to the build command
    buildCommand: pip install -r demo/requirements.txt
    startCommand: uvicorn --app-dir demo api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/kpis
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: ENTSO_API
        sync: false
